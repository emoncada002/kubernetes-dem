apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-demo
  template:
    metadata:
      labels:
        app: kubernetes-demo
    spec:
      containers:
      - name: app
        image: kubernetes-demo:2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
